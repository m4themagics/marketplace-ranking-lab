[project]
name = "marketplace-ranking-lab"
version = "0.1.0"
description = "Leakage-safe marketplace retrieval and ranking experiments, from classical baselines to neural retrieval and ANN."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    # mrl.data.otto cannot work without it, so it is not optional.
    "polars>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]
# Phase 1 — ad-hoc analysis over the converted Parquet.
data = [
    "duckdb>=1.0",
    "kaggle>=1.7",
    "pyarrow>=16",
]
# Phase 1 — classical baselines.
ranking = [
    "implicit>=0.7",
    "lightgbm>=4.3",
    "scikit-learn>=1.5",
]
# Phase 2 — neural retrieval and ranking.
neural = [
    "torch>=2.4",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mrl"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
